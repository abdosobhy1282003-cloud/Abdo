<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Abdelrahman Sobhy Mohamed | Physical Education Graduate</title>
    <meta name="description" content="Abdelrahman Sobhy Mohamed — Physical Education graduate, ICDL certified, skilled in data entry, IT support and computer use. Interactive bilingual CV (Arabic/English).">
    <meta property="og:title" content="Abdelrahman Sobhy Mohamed | Physical Education Graduate">
    <meta property="og:description" content="ICDL-certified graduate skilled in data entry, IT support and computer use. View the full interactive CV.">
    <meta property="og:type" content="profile">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!--
        ============================================================
        QR CODE NOTE (read me):
        The certificate photo that used to sit large in the CV sidebar
        is now a small thumbnail, and next to the contact info there is
        an empty QR placeholder box (id="cvQrImg", file path
        "images/qr.jpg"). It is intentionally left EMPTY — just drop
        your own QR image file at that path (named qr.jpg, next to your
        other images) and it will appear there automatically, at the
        same size, in the sidebar, in print, and in the downloaded PDF.
        Until that file exists, a neutral dashed placeholder is shown
        instead of a broken image icon.
        ============================================================
    -->

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --navy-950: #0a1526;
            --navy-900: #0f2138;
            --navy-800: #16304f;
            --navy-700: #1d3d63;
            --gold-500: #d4a017;
            --gold-400: #e8b923;
            --gold-300: #f5cc4d;
            --text-light: #eef2f7;
            --text-muted: #a9b8cc;
            --verify-500: #29c58f;
            --verify-400: #3ee0a5;
        }

        body {
            background:
                radial-gradient(circle at 15% 0%, #16304f 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, #12253d 0%, transparent 50%),
                linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 55%, #0c1c30 100%);
            background-attachment: fixed;
            font-family: 'Segoe UI', 'Cairo', 'Tahoma', sans-serif;
            padding: 2.5rem 1.5rem;
            min-height: 100vh;
            color: var(--text-light);
        }
        body.lang-en { font-family: 'Segoe UI', 'Poppins', sans-serif; }

        /* ===== Animations ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(28px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212,160,23,0.45), 0 10px 25px rgba(212,160,23,0.25); }
            50% { box-shadow: 0 0 0 12px rgba(212,160,23,0), 0 10px 25px rgba(212,160,23,0.35); }
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        @keyframes shimmerMove {
            0% { transform: translateX(-120%) skewX(-20deg); }
            100% { transform: translateX(220%) skewX(-20deg); }
        }
        @keyframes overlayFadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
        @keyframes overlayFadeOut {
            from { opacity: 1; } to { opacity: 0; }
        }
        @keyframes cvPanelIn {
            from { opacity: 0; transform: translateY(40px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .fade-in-up {
            animation: fadeInUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        /* Staggered entrance for the main blocks */
        .lang-switch.fade-in-up { animation-delay: 0.02s; }
        .profile-card.fade-in-up { animation-delay: 0.08s; }
        .certificate-btn.fade-in-up { animation-delay: 0.14s; }
        #dynamicContent .cv-section.fade-in-up:nth-of-type(1) { animation-delay: 0.18s; }
        #dynamicContent .cv-section.fade-in-up:nth-of-type(2) { animation-delay: 0.24s; }
        #dynamicContent .cv-section.fade-in-up:nth-of-type(3) { animation-delay: 0.30s; }
        #dynamicContent .cv-section.fade-in-up:nth-of-type(4) { animation-delay: 0.36s; }
        #dynamicContent .cv-section.fade-in-up:nth-of-type(5) { animation-delay: 0.42s; }
        .cv-trigger-wrap.fade-in-up { animation-delay: 0.46s; }
        .contact-links.fade-in-up { animation-delay: 0.50s; }

        .float-icon { display: inline-block; animation: floatIcon 3s ease-in-out infinite; }

        /* Respect the OS-level "reduce motion" accessibility setting —
           every decorative animation on the page is opt-out for anyone
           who finds motion distracting or physically uncomfortable. */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.001ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.001ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Visible keyboard-focus ring — the page is fully clickable, but
           until now had no clear focus indicator for keyboard/tab users. */
        a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
            outline: 2px solid var(--gold-300);
            outline-offset: 3px;
            border-radius: 8px;
        }

        .container { max-width: 1200px; margin: 0 auto; }
        [dir="ltr"] .container, body:not(.lang-ar) { text-align: left; }
        body.lang-ar .cv-section h2 { border-right: 6px solid var(--gold-400); border-left: none; padding-right: 1rem; padding-left: 0; }
        body:not(.lang-ar) .cv-section h2 { border-left: 6px solid var(--gold-400); border-right: none; padding-left: 1rem; padding-right: 0; }

        /* Language Switcher */
        .lang-switch { display: flex; justify-content: flex-end; gap: 1rem; margin-bottom: 1.5rem; }
        .lang-btn {
            background: rgba(255,255,255,0.06);
            color: var(--text-light);
            border: 1px solid rgba(212,160,23,0.35);
            padding: 8px 22px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            overflow: hidden;
        }
        .lang-btn.active { background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--navy-950); border-color: transparent; }
        .lang-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 20px rgba(212,160,23,0.25); border-color: var(--gold-400); }

        /* Profile Card */
        .profile-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            backdrop-filter: blur(14px);
            border-radius: 40px;
            padding: 2.2rem 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.35);
            display: flex;
            align-items: center;
            gap: 2.2rem;
            flex-wrap: wrap;
            justify-content: center;
            border: 1px solid rgba(212,160,23,0.25);
            position: relative;
            overflow: hidden;
        }
        .profile-card::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(120deg, transparent 40%, rgba(212,160,23,0.08) 50%, transparent 60%);
            pointer-events: none;
        }
        .profile-avatar img {
            width: 155px; height: 155px; object-fit: cover; border-radius: 50%;
            border: 4px solid var(--navy-900);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4), 0 0 0 5px var(--gold-400);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .profile-avatar img:hover { transform: scale(1.06) rotate(1deg); box-shadow: 0 18px 36px rgba(0,0,0,0.45), 0 0 0 6px var(--gold-300); }
        .profile-details { flex: 1; text-align: center; min-width: 260px; }
        .profile-details h1 { font-size: 2.2rem; margin-bottom: 0.4rem; letter-spacing: 0.3px; }
        .badge-title {
            background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
            color: var(--navy-950);
            display: inline-block; padding: 7px 20px; border-radius: 40px;
            font-weight: bold; margin: 8px 0; font-size: 1rem;
            animation: pulseGlow 2.6s ease-in-out infinite;
        }
        .profile-stats { display: flex; justify-content: center; gap: 0.8rem; flex-wrap: wrap; margin-top: 0.9rem; }
        .stat-item {
            background: rgba(212,160,23,0.12);
            border: 1px solid rgba(212,160,23,0.3);
            padding: 0.4rem 1.1rem; border-radius: 30px; font-size: 0.85rem; color: var(--gold-300);
        }

        /* CV Sections */
        .cv-section {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            backdrop-filter: blur(10px);
            border-radius: 28px;
            padding: 1.8rem 2rem;
            margin-bottom: 1.6rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cv-section:hover {
            transform: translateY(-6px);
            border-color: rgba(212,160,23,0.35);
            box-shadow: 0 18px 40px rgba(0,0,0,0.35);
        }
        .cv-section h2 { font-size: 1.5rem; margin-bottom: 1.3rem; display: flex; align-items: center; gap: 10px; color: var(--gold-300); }
        .cv-section p, .cv-section li { color: var(--text-light); line-height: 1.9; }

        .info-grid { display: flex; flex-wrap: wrap; gap: 1.6rem; }
        .info-card {
            flex: 1; min-width: 260px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(212,160,23,0.18);
            padding: 1.3rem 1.4rem; border-radius: 20px;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .info-card:hover {
            transform: translateY(-5px);
            background: rgba(212,160,23,0.06);
            border-color: var(--gold-400);
            box-shadow: 0 12px 26px rgba(0,0,0,0.3);
        }
        .info-card h3 { color: var(--gold-400); margin-bottom: 0.7rem; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; }
        .info-card ul { padding-inline-start: 1.2rem; }
        .info-card li { margin-bottom: 0.5rem; font-size: 0.95rem; }
        .info-card li::marker { color: var(--gold-400); }

        .age-note {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(212,160,23,0.14); border: 1px solid rgba(212,160,23,0.35);
            padding: 8px 18px; border-radius: 30px; margin-top: 1rem; font-size: 0.9rem; color: var(--gold-300);
        }

        .apply-box {
            display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;
            margin-top: 1.5rem; padding: 1.3rem 1.6rem;
            background: linear-gradient(135deg, rgba(212,160,23,0.14), rgba(212,160,23,0.05));
            border: 1px solid rgba(212,160,23,0.35); border-radius: 22px;
        }
        .apply-box p { margin: 0; font-size: 0.95rem; color: var(--text-muted); }
        .btn-apply {
            display: inline-flex; align-items: center; gap: 10px;
            background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
            color: var(--navy-950); font-weight: bold; text-decoration: none;
            padding: 12px 28px; border-radius: 50px; font-size: 1rem;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1); white-space: nowrap;
            position: relative; overflow: hidden;
        }
        .btn-apply:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 28px rgba(212,160,23,0.4); }

        .skills-wrapper { display: flex; flex-wrap: wrap; gap: 1.6rem; }
        .skills-col { flex: 1; min-width: 240px; background: rgba(255,255,255,0.03); border: 1px solid rgba(212,160,23,0.18); padding: 1.2rem; border-radius: 20px; }
        .skills-col h3 { color: var(--gold-400); margin-bottom: 0.8rem; font-size: 1.05rem; }
        .badge-skill {
            display: inline-block; background: rgba(255,255,255,0.06); border: 1px solid rgba(212,160,23,0.2);
            padding: 6px 14px; border-radius: 30px; margin: 5px; font-size: 0.87rem; color: var(--text-light);
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .badge-skill:hover {
            transform: translateY(-3px) scale(1.05);
            background: rgba(212,160,23,0.18);
            border-color: var(--gold-400);
            color: var(--gold-300);
        }

        /* Shimmer sweep effect for all gold / primary action buttons */
        .btn-apply, .btn-show-certs, .btn-cert-page,
        .btn-view-cv, .cv-pdf-btn, .cv-print-btn {
            position: relative; overflow: hidden;
        }
        .btn-apply::after, .btn-show-certs::after, .btn-cert-page::after,
        .btn-view-cv::after, .cv-pdf-btn::after, .cv-print-btn::after {
            content: '';
            position: absolute; top: 0; left: 0; width: 40%; height: 100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
            transform: translateX(-120%) skewX(-20deg);
            pointer-events: none;
        }
        .btn-apply:hover::after, .btn-show-certs:hover::after, .btn-cert-page:hover::after,
        .btn-view-cv:hover::after, .cv-pdf-btn:hover::after, .cv-print-btn:hover::after {
            animation: shimmerMove 0.9s ease forwards;
        }

        .courses-table { width: 100%; border-collapse: collapse; }
        .courses-table th, .courses-table td { border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 8px; text-align: left; font-size: 0.92rem; }
        body.lang-ar .courses-table th, body.lang-ar .courses-table td { text-align: right; }
        .courses-table th { color: var(--gold-400); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .notice { background: rgba(212,160,23,0.08); border-left: 4px solid var(--gold-400); padding: 10px 14px; border-radius: 14px; margin-top: 15px; font-size: 0.88rem; color: var(--text-muted); }
        body.lang-ar .notice { border-left: none; border-right: 4px solid var(--gold-400); }

        /* Certificate Button & Gallery */
        .certificate-btn { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        .btn-cert-page {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(212,160,23,0.45);
            padding: 15px 30px; border-radius: 60px; color: var(--gold-300);
            font-size: 1.1rem; font-weight: bold; cursor: pointer; text-decoration: none;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: inline-flex; align-items: center; gap: 10px;
        }
        .btn-cert-page:hover { transform: translateY(-3px) scale(1.03); background: rgba(212,160,23,0.14); box-shadow: 0 14px 30px rgba(212,160,23,0.25); border-color: var(--gold-400); }
        .btn-show-certs {
            background: linear-gradient(135deg, var(--gold-400), var(--gold-500));
            border: none; padding: 15px 34px; border-radius: 60px; color: var(--navy-950);
            font-size: 1.25rem; font-weight: bold; cursor: pointer;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            display: inline-flex; align-items: center; gap: 12px; box-shadow: 0 10px 25px rgba(212,160,23,0.25);
        }
        .btn-show-certs:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 14px 32px rgba(212,160,23,0.4); }
        .certificates-gallery {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px; padding: 2rem; margin: 1rem 0 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25); display: none; animation: fadeSlideDown 0.4s ease;
        }
        .certificates-gallery.show { display: block; }
        @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 1.6rem; }
        .cert-card {
            background: rgba(212,160,23,0.06); border: 1px solid rgba(212,160,23,0.25);
            border-radius: 20px; padding: 1rem; cursor: pointer; text-align: center;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cert-card:hover { transform: translateY(-8px) scale(1.02); box-shadow: 0 16px 30px rgba(0,0,0,0.35); border-color: var(--gold-400); }
        .cert-card img { width: 100%; max-height: 190px; object-fit: contain; border-radius: 14px; background: #0c1c30; }
        .cert-card p { margin-top: 12px; font-weight: bold; color: var(--gold-300); font-size: 0.9rem; }
        .gallery-note { text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem; }

        /* Lightbox */
        .img-lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,10,20,0.97); z-index: 3000; justify-content: center; align-items: center; cursor: pointer; }
        .img-lightbox.active { display: flex; }
        .img-lightbox img { max-width: 90%; max-height: 90%; object-fit: contain; border-radius: 16px; }
        .close-icon { position: absolute; top: 28px; right: 36px; font-size: 2.6rem; color: var(--text-light); background: rgba(255,255,255,0.08); width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1); }
        .close-icon:hover { background: var(--gold-500); color: var(--navy-950); transform: rotate(90deg) scale(1.08); }

        /* Contact Links + PDF buttons */
        .contact-links {
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 32px; padding: 1.5rem; text-align: center; margin: 2rem 0 0.5rem;
            display: flex; justify-content: center; gap: 1.1rem; flex-wrap: wrap;
        }
        .contact-btn {
            display: inline-flex; align-items: center; gap: 9px;
            color: var(--navy-950); padding: 12px 24px; border-radius: 50px; text-decoration: none;
            font-weight: bold; font-size: 0.92rem; transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1); border: none; cursor: pointer;
        }
        .contact-btn.whatsapp { background: #25D366; color: #06210f; }
        .contact-btn.call { background: rgba(255,255,255,0.1); color: var(--text-light); border: 1px solid rgba(255,255,255,0.2); }
        .contact-btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 10px 22px rgba(0,0,0,0.3); opacity: 0.97; }

        /* ===== View Full CV trigger button ===== */
        .cv-trigger-wrap { display: flex; justify-content: center; margin: 0.5rem 0 1.5rem; }
        .btn-view-cv {
            background: linear-gradient(135deg, var(--gold-300), var(--gold-500));
            border: none; color: var(--navy-950); font-weight: bold;
            padding: 18px 42px; border-radius: 60px; font-size: 1.3rem; cursor: pointer;
            display: inline-flex; align-items: center; gap: 14px;
            box-shadow: 0 12px 30px rgba(212,160,23,0.35);
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            animation: pulseGlow 2.8s ease-in-out infinite;
        }
        .btn-view-cv:hover { transform: translateY(-4px) scale(1.04); box-shadow: 0 18px 40px rgba(212,160,23,0.5); }

        footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.82rem; }

        /* ===== Extra polish: scroll progress bar ===== */
        .scroll-progress {
            position: fixed; top: 0; left: 0; height: 4px; width: 0%;
            background: linear-gradient(90deg, var(--gold-400), var(--verify-500));
            z-index: 6000; transition: width 0.15s ease-out;
        }

        /* ===== Extra polish: back-to-top button ===== */
        .back-to-top {
            position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--navy-950);
            border: none; font-size: 1.2rem; cursor: pointer; display: none; align-items: center; justify-content: center;
            box-shadow: 0 10px 24px rgba(0,0,0,0.4); z-index: 2500; transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .back-to-top.show { display: flex; animation: fadeInUp 0.3s ease both; }
        .back-to-top:hover { transform: translateY(-4px) scale(1.08); }
        body.lang-ar .back-to-top { right: auto; left: 24px; }

        /* ===== Extra polish: copy-to-clipboard toast ===== */
        .copy-toast {
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: var(--verify-500); color: #06210f; font-weight: bold; font-size: 0.9rem;
            padding: 10px 22px; border-radius: 22px; box-shadow: 0 10px 24px rgba(0,0,0,0.35);
            z-index: 6000; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            max-width: min(92vw, 460px); width: max-content; text-align: center;
            line-height: 1.5; overflow-wrap: break-word;
        }
        .copy-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .cv-sidebar-contact li { cursor: pointer; }
        .cv-sidebar-contact li:hover { color: var(--gold-300); }

        /* ============================================
           Full CV Overlay Page
           ============================================ */
        .cv-overlay {
            display: none;
            position: fixed; inset: 0; z-index: 5000;
            background: rgba(5,10,20,0.98);
            overflow-y: auto;
            padding: 3rem 1.2rem;
        }
        .cv-overlay.active { display: block; animation: overlayFadeIn 0.35s ease both; }
        .cv-overlay.closing { animation: overlayFadeOut 0.3s ease both; }

        .cv-overlay-panel {
            max-width: 1000px; margin: 0 auto; position: relative;
            background:
                radial-gradient(circle at 15% 0%, #16304f 0%, transparent 45%),
                radial-gradient(circle at 100% 100%, #12253d 0%, transparent 50%),
                linear-gradient(160deg, var(--navy-950) 0%, var(--navy-900) 55%, #0c1c30 100%);
            border: 1px solid rgba(212,160,23,0.3);
            border-radius: 40px;
            box-shadow: 0 40px 90px rgba(0,0,0,0.55);
            padding: 3rem 2.5rem 2.5rem;
            animation: cvPanelIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        .cv-close-btn {
            position: sticky; top: 0; margin-left: auto;
            display: flex; align-items: center; justify-content: center;
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(255,255,255,0.08); border: 1px solid rgba(212,160,23,0.35);
            color: var(--text-light); font-size: 1.5rem; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 10;
        }
        .cv-close-btn:hover { background: var(--gold-500); color: var(--navy-950); transform: rotate(90deg) scale(1.08); }
        body.lang-ar .cv-close-btn { margin-left: 0; margin-right: auto; }

        .cv-actions-bar {
            display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;
            margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid rgba(255,255,255,0.08);
        }
        .cv-pdf-btn, .cv-print-btn {
            display: inline-flex; align-items: center; gap: 10px;
            padding: 13px 28px; border-radius: 50px; border: none; cursor: pointer;
            font-weight: bold; font-size: 0.95rem;
            transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cv-pdf-btn { background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--navy-950); }
        .cv-print-btn { background: rgba(255,255,255,0.1); color: var(--text-light); border: 1px solid rgba(255,255,255,0.25); }
        .cv-pdf-btn:hover, .cv-print-btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 12px 26px rgba(0,0,0,0.3); }

        /* ============================================
           Full CV — professional resume layout
           (two columns: sidebar + main), Canva-template style
           ============================================ */
        .cv-resume-grid {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 2.2rem;
            align-items: start;
        }

        .cv-sidebar {
            background: linear-gradient(160deg, rgba(212,160,23,0.10), rgba(255,255,255,0.03));
            border: 1px solid rgba(212,160,23,0.28);
            border-radius: 28px;
            padding: 2rem 1.5rem;
            text-align: center;
            position: sticky;
            top: 1rem;
        }
        .cv-sidebar-photo {
            width: 128px; height: 128px; object-fit: cover; border-radius: 50%;
            border: 4px solid var(--navy-900);
            box-shadow: 0 12px 26px rgba(0,0,0,0.4), 0 0 0 5px var(--gold-400);
            margin-bottom: 1rem;
        }
        .cv-sidebar-name {
            font-size: 1.45rem; margin-bottom: 0.5rem; line-height: 1.3;
            color: var(--gold-300);
        }
        .cv-sidebar-block { text-align: start; margin-top: 1.6rem; padding-top: 1.4rem; border-top: 1px solid rgba(212,160,23,0.2); }
        .cv-sidebar-heading { color: var(--gold-400); font-size: 1.02rem; margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px; }
        .cv-sidebar-contact { list-style: none; display: flex; flex-direction: column; gap: 0.6rem; }
        .cv-sidebar-contact li { display: flex; align-items: center; gap: 10px; font-size: 0.95rem; color: var(--text-muted); direction: ltr; justify-content: flex-start; }
        body.lang-ar .cv-sidebar-contact li { justify-content: flex-end; }
        .cv-sidebar-contact li i { color: var(--gold-400); width: 16px; text-align: center; }
        .cv-sidebar-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .cv-tag { margin: 0; font-size: 0.85rem; padding: 5px 12px; }

        /* Graduation milestone — a compact visual badge (small photo +
           key facts in one row), deliberately different from the plain
           Education paragraph below. */
        .cv-grad-badge {
            text-align: start; margin-top: 1.3rem;
            display: flex; flex-direction: column; gap: 0.85rem;
            background: linear-gradient(135deg, rgba(212,160,23,0.18), rgba(212,160,23,0.05));
            border: 1px solid rgba(212,160,23,0.45);
            border-radius: 18px;
            padding: 1rem 1rem 1.1rem;
        }
        /* Row 1: small clickable graduation-certificate thumbnail +
           faculty/university/date, side by side (click photo to enlarge). */
        .cv-grad-thumb-row { display: flex; align-items: center; gap: 12px; }
        .cv-grad-thumb {
            width: 58px; height: 58px; flex-shrink: 0; object-fit: cover; border-radius: 10px;
            border: 1px solid rgba(212,160,23,0.4); cursor: pointer; background: #f4f1e8;
            transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .cv-grad-thumb:hover { transform: scale(1.06); border-color: var(--gold-400); }
        .cv-grad-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
        .cv-grad-eyebrow {
            display: inline-flex; align-items: center; gap: 6px; width: fit-content;
            background: linear-gradient(135deg, var(--gold-400), var(--gold-500)); color: var(--navy-950);
            font-size: 0.78rem; font-weight: bold; padding: 3px 12px; border-radius: 20px; margin-bottom: 2px;
        }
        .cv-grad-eyebrow::before { content: '🎓'; }
        .cv-grad-info strong { font-size: 1.08rem; color: var(--gold-300); font-weight: 700; }
        .cv-grad-info > span:not(.cv-grad-date) { font-size: 0.94rem; color: var(--text-light); opacity: 0.92; }
        .cv-grad-date { font-size: 0.92rem; color: var(--gold-400); font-weight: 700; display: flex; align-items: center; gap: 6px; margin-top: 2px; }

        /* Row 2: contact list beside the QR box — placed together on
           purpose so there's no empty space next to the QR image. */
        .cv-contact-qr-row {
            display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap;
            padding-top: 0.85rem; border-top: 1px dashed rgba(212,160,23,0.3);
        }
        .cv-grad-contact { flex: 1 1 140px; min-width: 140px; }
        .cv-grad-contact .cv-sidebar-heading { margin-bottom: 0.5rem; }

        /* ===== QR block: sits next to the contact list. The frame is a
           fixed square (the QR itself is always square) and object-fit:
           contain means whatever image is dropped in auto-sizes to fill
           that square cleanly with no cropping or distortion. ===== */
        .cv-qr-block { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 116px; }
        .cv-qr-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(41,197,143,0.14); border: 1px solid rgba(41,197,143,0.45); color: var(--verify-400);
            font-size: 0.66rem; font-weight: bold; padding: 2px 9px; border-radius: 20px; white-space: nowrap;
        }
        .cv-qr-frame {
            width: 108px; height: 108px; background: #fff; border-radius: 12px;
            border: 1px dashed rgba(212,160,23,0.55); box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .cv-qr-frame img { width: 100%; height: 100%; object-fit: contain; }
        .cv-qr-caption { font-size: 0.66rem; color: var(--text-muted); line-height: 1.35; text-align: center; }

        .cv-main { display: flex; flex-direction: column; gap: 1.4rem; }
        .cv-main-block {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 22px;
            padding: 1.6rem 1.8rem;
        }
        .cv-main-block h2 { font-size: 1.35rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; color: var(--gold-300); }
        .cv-main-block p { color: var(--text-light); line-height: 1.85; font-size: 1.04rem; }
        /* Screen-only bump for the table/notice inside the Full CV overlay
           (scoped to .cv-overlay-panel so the homepage's own copies of
           these same classes are untouched) — print and PDF export keep
           their own explicit, already-tuned sizes further down. */
        .cv-overlay-panel .courses-table th, .cv-overlay-panel .courses-table td { font-size: 0.98rem; }
        .cv-overlay-panel .notice { font-size: 0.95rem; }

        @media (max-width: 900px) {
            .cv-resume-grid { grid-template-columns: 1fr; }
            .cv-sidebar { position: static; }
        }

        @media (max-width: 750px) {
            body { padding: 1.2rem 0.9rem; }
            .btn-show-certs, .btn-cert-page { font-size: 1.05rem; padding: 12px 24px; }
            .close-icon { top: 18px; right: 18px; width: 45px; height: 45px; font-size: 2rem; }
            .apply-box { flex-direction: column; align-items: stretch; text-align: center; }
            .btn-view-cv { font-size: 1.05rem; padding: 14px 28px; }
            .cv-overlay-panel { padding: 2.2rem 1.3rem 1.8rem; border-radius: 28px; }
        }

        /* ============================================
           Print styles — only the CV overlay content prints,
           sized precisely for A4. Long text blocks are allowed to break
           naturally across pages (instead of being forced whole onto the
           next page) so no page is left half-empty.
           ============================================ */
        @page {
            size: A4;
            margin: 10mm;
        }
        @media print {
            /* Animations mid-flight at the moment of printing is what caused
               text to vanish while images stayed visible — kill all motion
               for print so every element is captured at its final, fully
               visible state. */
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }

            html, body { background: #fff !important; margin: 0; }

            /* Arabic text vanishing near the page edge when printing
               was an overflow bug, not a language bug: some inline runs
               were sizing themselves against the on-screen direction and
               then quietly overflowing their box once print's tighter A4
               width kicked in. In RTL that overflow bleeds toward the
               LEFT edge of the page instead of the right, so the part
               that got clipped by the page boundary looked like "text
               disappearing from the left". Two things fix it together:
               (1) don't just rely on the inherited `dir` attribute —
               some print/PDF pipelines (older WebViews, in-app browsers)
               don't carry it through faithfully — so direction and
               alignment are restated explicitly here; (2) force every
               run to wrap inside its box instead of overflowing it. */
            body.lang-ar, body.lang-ar * { direction: rtl !important; }
            body.lang-ar .cv-overlay-panel,
            body.lang-ar .cv-sidebar,
            body.lang-ar .cv-main-block,
            body.lang-ar .cv-main-block h2,
            body.lang-ar .cv-sidebar-heading,
            body.lang-ar .courses-table th,
            body.lang-ar .courses-table td,
            body.lang-ar .notice { text-align: right !important; }
            /* Phone numbers stay a left-to-right digit run (so they read
               01028414049, not reversed) even though the paragraph
               around them is RTL — same as on screen — but now right-
               aligned to match the rest of the printed sidebar. */
            body.lang-ar .cv-sidebar-contact li { direction: ltr !important; justify-content: flex-end !important; }
            .cv-overlay-panel, .cv-overlay-panel * {
                max-width: 100%;
                overflow-wrap: break-word !important;
                word-break: break-word !important;
                box-sizing: border-box;
            }

            /* Hide everything except the CV overlay using display:none
               (not visibility:hidden). visibility:hidden keeps the hidden
               content's layout space reserved, which was pushing the real
               CV several page-heights down the document and printing
               blank pages first. display:none removes it from the flow
               completely, so the CV starts on page 1. */
            body > .container,
            body > #imgLightbox,
            body > #scrollProgress,
            body > #backToTopBtn,
            body > #copyToast {
                display: none !important;
            }

            .cv-overlay {
                display: block !important;
                position: static !important;
                background: #fff !important;
                padding: 0 !important;
                overflow: visible !important;
            }
            .cv-overlay-panel {
                background: #fff !important; color: #111 !important;
                box-shadow: none !important; border: none !important;
                border-radius: 0 !important;
                max-width: 100%; width: 100%; margin: 0; padding: 0 !important;
                opacity: 1 !important; transform: none !important;
            }
            .cv-overlay-panel * { color: #111 !important; }
            .cv-close-btn, .cv-actions-bar { display: none !important; }

            /* Stack the sidebar above the main column instead of the
               on-screen CSS grid. Grid columns don't paginate reliably
               across printed pages (the whole row has to break together),
               which is what was splitting the CV oddly across extra
               pages. A normal block flow lets each section break on its
               own, cleanly, within the A4 page. */
            .cv-resume-grid { display: block !important; }
            .cv-sidebar {
                position: static !important;
                width: 100% !important;
                background: #f6f6f6 !important;
                border: 1px solid #ddd !important;
                border-radius: 8px !important;
                padding: 4mm 4mm !important;
                margin-bottom: 4mm !important;
                page-break-inside: avoid; break-inside: avoid;
            }
            .cv-sidebar-photo { width: 20mm; height: 20mm; box-shadow: none !important; border: 2px solid #ccc !important; }
            .cv-sidebar-name { font-size: 14pt; }
            .cv-sidebar-block { margin-top: 2.2mm; padding-top: 1.8mm; border-color: #ddd !important; page-break-inside: avoid; break-inside: avoid; }
            .cv-sidebar-heading { font-size: 10pt; color: #b8860b !important; }
            .cv-sidebar-contact li { font-size: 9pt; }
            .cv-tag { font-size: 8pt; padding: 2px 8px; }

            /* Graduation moment: small photo + facts in one row, then the
               contact list and the QR box together in a second row — so
               nothing sits alone with empty space around it. */
            .cv-grad-badge {
                page-break-inside: avoid; break-inside: avoid;
                margin-top: 2.2mm; padding: 2.2mm 3mm;
                background: #fdf3d9 !important;
                border: 1px solid #d9ac2f !important;
                border-radius: 6px !important;
                display: flex !important; flex-direction: column !important;
                gap: 2mm !important;
            }
            .cv-grad-thumb-row { display: flex !important; flex-direction: row !important; align-items: center !important; gap: 2.5mm !important; }
            .cv-grad-thumb { width: 13mm !important; height: 13mm !important; box-shadow: none !important; border: 1px solid #ccc !important; }
            .cv-grad-info { flex: 1; min-width: 0; }
            .cv-grad-eyebrow { font-size: 7.6pt; padding: 2px 8px; }
            .cv-grad-info strong { font-size: 9.5pt; }
            .cv-grad-info > span:not(.cv-grad-date) { font-size: 9pt; }
            .cv-grad-date { font-size: 8.5pt; color: #8a6300 !important; }

            .cv-contact-qr-row { display: flex !important; flex-direction: row !important; align-items: flex-start !important; gap: 3mm !important; border-color: #d9ac2f !important; padding-top: 2mm !important; }
            .cv-grad-contact { flex: 1; min-width: 0; }
            .cv-qr-block { width: 28mm !important; gap: 1mm !important; }
            .cv-qr-badge { background: #e6faf1 !important; border: 1px solid #29c58f !important; color: #158a5f !important; font-size: 6.4pt !important; padding: 1px 6px !important; }
            .cv-qr-frame { width: 26mm !important; height: 26mm !important; border: 1px dashed #d9ac2f !important; box-shadow: none !important; }
            .cv-qr-caption { font-size: 6.2pt !important; }

            /* Long text blocks are allowed to break naturally across a
               page boundary (no forced page-break-inside:avoid here) —
               that's what stops a block from jumping whole onto the next
               page and leaving the current page half-empty. Only small,
               atomic pieces (table rows, tags, the sidebar) stay unbroken. */
            .cv-main { gap: 2.6mm !important; }
            .cv-main-block {
                background: #fafafa !important; border: 1px solid #ddd !important;
                border-radius: 8px !important; padding: 2.8mm 4mm !important;
            }
            .cv-main-block h2 { font-size: 13.5pt; margin-bottom: 2mm; page-break-after: avoid; break-after: avoid; }
            .cv-main-block p { font-size: 11pt; line-height: 1.5; orphans: 3; widows: 3; }

            .courses-table { font-size: 9.6pt; }
            .courses-table th, .courses-table td { padding: 1.6mm 1.6mm; }
            .courses-table tr { page-break-inside: avoid; break-inside: avoid; }
            .notice { font-size: 8.8pt; padding: 1.8mm 3mm; }

            .badge-skill { border: 1px solid #ccc !important; background: #f2f2f2 !important; color: #111 !important; }
        }

        /* ============================================
           PDF export flattening — applied to the live DOM (via a
           temporary class on <body>) only while html2canvas captures
           the CV for the "Download PDF" button. Mirrors the @media
           print flattening above, so the exported file matches what
           the Print button produces, but this version is usable
           on-screen because html2canvas doesn't apply print media
           queries.
           ============================================ */
        body.pdf-exporting .container,
        body.pdf-exporting #imgLightbox,
        body.pdf-exporting #scrollProgress,
        body.pdf-exporting #backToTopBtn,
        body.pdf-exporting #copyToast { display: none !important; }
        body.pdf-exporting .cv-overlay {
            position: static !important; background: #fff !important;
            padding: 0 !important; overflow: visible !important; inset: auto !important;
        }
        body.pdf-exporting .cv-overlay-panel {
            background: #fff !important; color: #111 !important;
            box-shadow: none !important; border: none !important; border-radius: 0 !important;
            width: 800px !important; max-width: 800px !important; margin: 0 !important; padding: 24px !important;
            opacity: 1 !important; transform: none !important; animation: none !important;
        }
        body.pdf-exporting .cv-overlay-panel * { color: #111 !important; animation: none !important; transition: none !important; }
        body.pdf-exporting .cv-close-btn,
        body.pdf-exporting .cv-actions-bar { display: none !important; }
        body.pdf-exporting .cv-resume-grid { display: block !important; }
        body.pdf-exporting .cv-sidebar {
            position: static !important; width: 100% !important;
            background: #f6f6f6 !important; border: 1px solid #ddd !important;
            border-radius: 8px !important; padding: 18px !important; margin-bottom: 18px !important;
        }
        body.pdf-exporting .cv-sidebar-photo { width: 88px; height: 88px; box-shadow: none !important; border: 2px solid #ccc !important; }
        body.pdf-exporting .cv-sidebar-name { font-size: 19px !important; }
        body.pdf-exporting .cv-sidebar-heading { font-size: 14px !important; color: #b8860b !important; }
        body.pdf-exporting .cv-sidebar-contact li { font-size: 12px !important; }
        body.pdf-exporting .cv-tag { font-size: 11px !important; }
        body.pdf-exporting .cv-grad-badge {
            background: #fdf3d9 !important; border: 1px solid #d9ac2f !important; border-radius: 8px !important;
        }
        body.pdf-exporting .cv-grad-thumb { width: 50px !important; height: 50px !important; box-shadow: none !important; background: #fff !important; border: 1px solid #ccc !important; }
        body.pdf-exporting .cv-grad-eyebrow { font-size: 11px !important; }
        body.pdf-exporting .cv-grad-info strong { font-size: 13px !important; }
        body.pdf-exporting .cv-grad-info > span:not(.cv-grad-date) { font-size: 12px !important; }
        body.pdf-exporting .cv-grad-date { color: #8a6300 !important; font-size: 12px !important; }
        body.pdf-exporting .cv-contact-qr-row { border-color: #d9ac2f !important; }
        body.pdf-exporting .cv-qr-block { width: 104px !important; }
        body.pdf-exporting .cv-qr-badge { background: #e6faf1 !important; border: 1px solid #29c58f !important; color: #158a5f !important; font-size: 9px !important; }
        body.pdf-exporting .cv-qr-frame { width: 96px !important; height: 96px !important; border: 1px dashed #d9ac2f !important; box-shadow: none !important; }
        body.pdf-exporting .cv-qr-caption { font-size: 9.5px !important; }
        body.pdf-exporting .cv-main-block {
            background: #fafafa !important; border: 1px solid #ddd !important; border-radius: 8px !important;
        }
        body.pdf-exporting .cv-main-block h2 { font-size: 18px !important; }
        body.pdf-exporting .cv-main-block p { font-size: 15px !important; line-height: 1.5 !important; }
        body.pdf-exporting .courses-table { font-size: 13px !important; }
        body.pdf-exporting .notice { font-size: 12px !important; }
        body.pdf-exporting .badge-skill { border: 1px solid #ccc !important; background: #f2f2f2 !important; color: #111 !important; }
    </style>
</head>

<div class="scroll-progress" id="scrollProgress"></div>

<div class="container">

        <a href="tel:+201028414049" class="contact-btn call"><i class="fas fa-phone-alt"></i> <span id="callText"></span></a>

</div>

<!-- Lightbox -->

<!-- ============================================
     Full CV Overlay Page
     ============================================ -->
<div id="cvOverlay" class="cv-overlay">
    <div class="cv-overlay-panel cv-resume">
        <div class="cv-close-btn" id="closeCvBtn" title="Close">✖</div>

        <div class="cv-resume-grid">
            <!-- Sidebar -->
            <aside class="cv-sidebar">
                <img class="cv-sidebar-photo" src="profil.jpg" alt="Profile" onerror="this.src='https://placehold.co/400x400/0f2138/d4a017?text=CV'">
                <h1 id="cv-profile-name" class="cv-sidebar-name"></h1>
                <div class="badge-title" id="cv-profile-title"></div>

                <!-- Graduation highlight: a compact photo + facts row, and
                     below it the contact list sitting right next to the
                     QR placeholder (so there's no leftover empty space

    let toastHideTimer = null;
    function showToast(message) {
        if (!copyToastEl) return;
        copyToastEl.innerText = message;
        copyToastEl.classList.add('show');
        if (toastHideTimer) clearTimeout(toastHideTimer);
        toastHideTimer = setTimeout(() => copyToastEl.classList.remove('show'), 3200);
    }

    function openCvOverlay() {
        cvOverlay.classList.remove('closing');
        cvOverlay.classList.add('active');
        document.body.style.overflow = 'hidden';
    }
    function closeCvOverlay() {
        cvOverlay.classList.add('closing');
        document.body.style.overflow = '';
        setTimeout(() => {
            cvOverlay.classList.remove('active', 'closing');
        }, 280);
    }
    openCvBtn.addEventListener('click', openCvOverlay);
    closeCvBtn.addEventListener('click', closeCvOverlay);
    cvOverlay.addEventListener('click', (e) => { if (e.target === cvOverlay) closeCvOverlay(); });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && cvOverlay.classList.contains('active')) closeCvOverlay();
    });

    // "Print" still goes through the browser's native print pipeline
    // (window.print) — that's the right tool for an actual printer.
    //
    // "Download PDF" builds a real PDF file in the browser (using
    // html2canvas to snapshot the flattened, print-style layout, then
    // jsPDF to paginate it onto A4 pages) and saves it straight to the
    // Downloads folder — no print dialog, no manual "Save as PDF" step.
    // This only works when the page is served over http(s) (a real host,
    // or a local dev server) — see the file:// check inside the function
    // for why a locally double-clicked HTML file can't do this and falls
    // back to print with an on-screen explanation instead.
    const downloadFileName = 'Abdelrahman-Sobhy-CV';

    async function downloadCvPdf() {
        if (!cvOverlay.classList.contains('active')) openCvOverlay();
        await new Promise(r => setTimeout(r, 150));

        // If this page was opened by double-clicking the file (file://...
        // instead of http(s)://...), html2canvas can never finish here:
        // browsers give every file:// resource its own private origin, so
        // the moment html2canvas paints the local profile/certificate
        // photos onto its canvas, that canvas is "tainted" and refuses to
        // export — with no in-browser workaround. That's why "Download
        // PDF" used to jump straight to print every single time, with no
        // explanation. We now detect that up front and say so, instead of
        // silently doing the same fallback and leaving it a mystery.
        if (window.location.protocol === 'file:') {
            showToast(content[currentLang].fileProtocolNotice);
            setTimeout(() => { if (!cvOverlay.classList.contains('active')) openCvOverlay(); window.print(); }, 1100);
            return;
        }

        document.body.classList.add('pdf-exporting');
        await new Promise(r => setTimeout(r, 60)); // let layout settle

        // Make sure every web font — the Arabic font included — has
        // actually finished loading before the snapshot. Capturing
        // mid-swap is a common cause of icons/glyphs going missing or
        // metrics shifting in the exported image.
        if (window.document.fonts && document.fonts.ready) {
            try { await document.fonts.ready; } catch (e) { /* non-fatal */ }
        }

        const target = document.querySelector('.cv-overlay-panel');
        const baseOptions = { scale: 2, backgroundColor: '#ffffff', useCORS: true };

        try {
            let canvas;
            try {
                // foreignObjectRendering hands the actual text drawing back
                // to the browser's own rendering engine (via an SVG
                // <foreignObject>) instead of html2canvas's own manual
                // text layout. That's what keeps joined Arabic letters
                // intact — html2canvas's manual text renderer doesn't
                // reliably reproduce Arabic letter-joining/shaping, which
                // is what made Arabic text come out broken apart, or
                // missing altogether, in the exported PDF.
                canvas = await html2canvas(target, { ...baseOptions, foreignObjectRendering: true });
            } catch (foreignObjectErr) {
                console.warn('PDF export: foreignObjectRendering failed, retrying in standard html2canvas mode.', foreignObjectErr);
                canvas = await html2canvas(target, baseOptions);
            }

            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = 210;
            const pageHeight = 297;
            const imgWidthFull = pageWidth;
            const imgHeightFull = (canvas.height * imgWidthFull) / canvas.width;
            const imgData = canvas.toDataURL('image/jpeg', 0.95);

            // A tidy, professional CV should be exactly one A4 page with
            // no dangling near-empty second page. So:
            //  - content that already fits -> placed as-is, one page.
            //  - content that overshoots by a small margin (<=15%) -> the
            //    whole page is scaled down slightly so it still lands on
            //    a single A4 sheet.
            //  - content that's genuinely too long for one page -> sliced
            //    cleanly across as few pages as actually needed, ignoring
            //    any leftover sliver under 5mm so no blank trailing page
            //    gets created.
            if (imgHeightFull <= pageHeight) {
                pdf.addImage(imgData, 'JPEG', 0, 0, imgWidthFull, imgHeightFull);
            } else if (imgHeightFull <= pageHeight * 1.15) {
                const scale = pageHeight / imgHeightFull;
                const fitWidth = imgWidthFull * scale;
                const xOffset = (pageWidth - fitWidth) / 2;
                pdf.addImage(imgData, 'JPEG', xOffset, 0, fitWidth, pageHeight);
            } else {
                let heightLeft = imgHeightFull;
                let position = 0;
                pdf.addImage(imgData, 'JPEG', 0, position, imgWidthFull, imgHeightFull);
                heightLeft -= pageHeight;
                while (heightLeft > 5) {
                    position -= pageHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidthFull, imgHeightFull);
                    heightLeft -= pageHeight;
                }
            }
            pdf.save(downloadFileName + '.pdf');
        } catch (err) {
            // If PDF generation fails for any other reason (e.g. the CDN
            // libraries didn't load), fall back to the native print
            // dialog so the person can still export via "Save as PDF" —
            // but say so, rather than switching silently.
            console.error('PDF export failed, falling back to the print dialog:', err);
            showToast(content[currentLang].pdfFallbackNotice);
            setTimeout(() => window.print(), 700);
        } finally {
            document.body.classList.remove('pdf-exporting');
        }
    }

    function printCv() {
        if (!cvOverlay.classList.contains('active')) openCvOverlay();
        setTimeout(() => window.print(), 150);
    }

    const cvDownloadPdfBtn = document.getElementById('cvDownloadPdfBtn');
    cvDownloadPdfBtn.addEventListener('click', downloadCvPdf);

    const cvPrintBtn = document.getElementById('cvPrintBtn');
    cvPrintBtn.addEventListener('click', printCv);

    // ============================================
    // Scroll progress bar + back-to-top button
    // ============================================
    const scrollProgressEl = document.getElementById('scrollProgress');
    const backToTopBtn = document.getElementById('backToTopBtn');
    function onScrollUpdate() {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        const pct = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
        if (scrollProgressEl) scrollProgressEl.style.width = pct + '%';
        if (backToTopBtn) backToTopBtn.classList.toggle('show', scrollTop > 400);
    }
    window.addEventListener('scroll', onScrollUpdate, { passive: true });
    if (backToTopBtn) backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // ============================================
    // Tap-to-copy phone number (WhatsApp / Call rows inside the CV
    // sidebar) — a small, recruiter-friendly convenience touch.
    // ============================================
    function copyToClipboard(text) {
        const done = () => showToast(content[currentLang].copiedToast);
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(done);
        } else {
            done();
        }
    }
    ['cvWhatsappItem', 'cvCallItem'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('click', () => copyToClipboard('01028414049'));
    });

    // Initialize with English
    updateLanguage('en');
</script>
</body>
</html>
